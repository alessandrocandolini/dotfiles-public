# tell Tmux that outside terminal supports true color
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-features "*:hyperlinks"
set-window-option -g xterm-keys on

set -g default-command "${SHELL}"

# Scroll History
set -g history-limit 30000

# Enable scrolling in tmux panels with mouse wheel
set -g mouse on

# Disable status bar
set -g status off

# Use vim mode, no emacs mode
set -g mode-keys vi

# can improve cursor responsiveness and fix issues with autoread in neovim
set-option -g focus-events on

# Lower escape timing from 500ms to 1ms for quicker response to scroll-buffer access
set-option -s escape-time 1

# Lower escape timing from 500ms to 10ms for quicker response when scrolling
set-option -g repeat-time 10

# Split panes in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %  split-window -h -c "#{pane_current_path}"

# Use tmux as a tile windown manager vertically
set-hook -g window-layout-changed "if-shell -F '#{window_zoomed_flag}' '' 'select-layout even-vertical'"
set-hook -g pane-exited "run-shell 'tmux if-shell -F -t #{hook_window} \"##{window_zoomed_flag}\" \"\" \"select-layout -t #{hook_window} even-vertical\" 2>/dev/null || true'"

# Vim-style pane navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
